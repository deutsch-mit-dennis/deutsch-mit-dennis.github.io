<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – Deutsch mit Dennis</title>
<script>
  // Old or mistyped path like /hoeren/xyz: try the matching page of the app (/#hoeren/xyz).
  (function () {
    var p = location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html?$/, '');
    if (p && !/\.\w{2,4}$/.test(p) && /^[\w\-\/äöüß]+$/i.test(decodeURIComponent(p))) location.replace('/#' + p.toLowerCase());
  })();
</script>
<style>
  body{margin:0;background:#fbfbf8;color:#172036;font:18px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:640px;margin:0 auto;padding:48px 16px}
  h1{font-size:28px;line-height:1.2;margin:0 0 12px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  a.b{display:inline-flex;align-items:center;min-height:48px;padding:10px 18px;border-radius:999px;background:#2341B5;color:#fff;font-weight:700;text-decoration:none}
  a.b.q{background:#fff;color:#2341B5;border:2px solid #2341B5}
  a:focus-visible{outline:3px solid #172036;outline-offset:2px}
</style>
</head>
<body>
<main>
  <p style="font-size:48px;margin:0" aria-hidden="true">🧭</p>
  <h1>Diese Seite gibt es nicht (mehr)</h1>
  <p>Vielleicht ist der Link alt oder falsch geschrieben. Hier geht es weiter:</p>
  <div class="btns">
    <a class="b" href="/">🏠 Startseite</a>
    <a class="b q" href="/#lernweg">Mein Lernweg</a>
    <a class="b q" href="/#pruefung">Prüfung</a>
    <a class="b q" href="/#spiele">Spiele</a>
  </div>
</main>
</body>
</html>
