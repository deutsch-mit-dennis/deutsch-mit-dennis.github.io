# Baut die Bereichsseiten (/pruefung/, /lernpakete/<paket>/ …), Lieder-/LiD-/Simulations-Seiten und die Sitemap neu,
# sobald index.html, Inhalte oder die Generatoren geändert werden. Die Bereichsseiten sind Kopien von index.html –
# ohne diesen Lauf würden sie alte ?v=-Nummern behalten.
name: Seiten aktualisieren
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-data.js'
      - 'lieder-data.js'
      - 'lid-katalog.js'
      - 'lid-bilder-alt.js'
      - 'sim/**'
      - 'tools/legal/**'
      - 'tools/make-share-pages.py'
      - 'tools/make-seo-pages.py'
      - 'tools/make-learn-pages.py'
      - 'content.js'
      - 'grammatik-data.js'
      - 'kurs-data.js'
      - 'hoeren-data.js'
      - 'lesen-data.js'
      - 'pruefung-fakten.js'
      - 'lid-laender.js'
      - 'lid-warum.js'
      - 'tools/build-sitemap.js'
      - '.github/workflows/seiten.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-bot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-sitemap.js reads the date of the last change from the git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Seiten erzeugen
        run: python3 -X utf8 tools/make-share-pages.py
      - name: Speichern
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Seiten aktualisiert"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
