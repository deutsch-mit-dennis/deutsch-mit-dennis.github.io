# Nur nötig, wenn die Website über GitHub Pages läuft: holt jeden Morgen neue YouTube-Videos.
name: YouTube-Videos aktualisieren
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-youtube-feed.mjs
      - run: |
          git config user.name "youtube-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add youtube-feed.json
          git diff --cached --quiet || git commit -m "Neue YouTube-Videos"
          git push
